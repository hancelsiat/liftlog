
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        .card {
            max-width: 500px;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }
        .icon {
            font-size: 50px;
            color: #2ecc71;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        p {
            font-size: 16px;
            color: #555;
            line-height: 1.5;
        }
        .spinner {
            margin: 20px auto 0;
            width: 30px;
            height: 30px;
            border: 4px solid #ddd;
            border-top-color: #2ecc71;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background-color: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
        .app-info {
            margin-top: 30px;
            font-size: 14px;
            color: #888;
        }
        .countdown {
            font-weight: bold;
            color: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#10004;</div>
        <h1>Verification Successful!</h1>
        <p>Your email address has been successfully verified.</p>
        <p>Redirecting you to the Login page in <span class="countdown" id="countdown">3</span> seconds...</p>
        <div class="spinner"></div>
        
        <a href="liftlog://login" class="btn" id="openAppBtn">Open LiftLog App</a>
        
        <p class="app-info">If the app does not open automatically, please close this page and log in to the LiftLog app manually.</p>
    </div>

    <script>
        let seconds = 3;
        const countdownEl = document.getElementById('countdown');
        const openAppBtn = document.getElementById('openAppBtn');

        const redirectToApp = () => {
            // Try to deep link into Flutter app first
            window.location.href = 'liftlog://login';
            
            // Fallback: If deep link fails after 1 second, try to go back in history or close
            setTimeout(() => {
                // Attempt to close the tab (usually works only if script opened it)
                window.close();
            }, 1000);
        };

        const timer = setInterval(() => {
            seconds--;
            countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                redirectToApp();
            }
        }, 1000);

        openAppBtn.addEventListener('click', (e) => {
            e.preventDefault();
            redirectToApp();
        });

        // Attempt to immediately invoke the app in background on mobile
        setTimeout(() => {
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = 'liftlog://login';
            document.body.appendChild(iframe);
        }, 100);
    </script>
</body>
</html>
